name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Postavi JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (bez testova)
        id: build
        run: |
          set -o pipefail
          # Kompajliraj glavni i testni kod; greske kompilacije emitiraj kao ::error anotacije.
          mvn -B -ntp -DskipTests package 2>&1 | tee build.log || true
          if ! grep -q "BUILD SUCCESS" build.log; then
            echo "Build nije uspio - emitiram anotacije kompilacijskih gresaka."
            # Format Maven compilera: [ERROR] /path/File.java:[line,col] poruka
            grep -oE "\[ERROR\] [^ ]+\.java:\[[0-9]+,[0-9]+\][^$]*" build.log | while read -r line; do
              file=$(echo "$line" | sed -E 's/^\[ERROR\] ([^:]+):\[([0-9]+),([0-9]+)\].*/\1/')
              ln=$(echo "$line"   | sed -E 's/^\[ERROR\] ([^:]+):\[([0-9]+),([0-9]+)\].*/\2/')
              col=$(echo "$line"  | sed -E 's/^\[ERROR\] ([^:]+):\[([0-9]+),([0-9]+)\].*/\3/')
              msg=$(echo "$line"  | sed -E 's/^\[ERROR\] [^ ]+\.java:\[[0-9]+,[0-9]+\] //')
              rel=${file#"$GITHUB_WORKSPACE/"}
              echo "::error file=${rel},line=${ln},col=${col}::${msg}"
            done
            echo "::error title=Build::Maven build nije uspio (vidi build.log / anotacije iznad)."
            exit 1
          fi
          echo "Build uspjesan."

      - name: Funkcionalni testovi
        id: functional
        continue-on-error: true
        run: mvn -B -ntp test -Dgroups=functional

      - name: Sacuvaj funkcionalne izvjestaje
        if: always()
        run: |
          mkdir -p reports/functional
          cp target/surefire-reports/TEST-*.xml reports/functional/ 2>/dev/null || true
          rm -rf target/surefire-reports

      - name: Sigurnosni testovi
        id: security
        continue-on-error: ${{ github.ref_name != 'rjesenja' }}
        run: mvn -B -ntp test -Dgroups=security

      - name: Sacuvaj sigurnosne izvjestaje
        if: always()
        run: |
          mkdir -p reports/security
          cp target/surefire-reports/TEST-*.xml reports/security/ 2>/dev/null || true

      - name: Sazetak po vjezbi (anotacije)
        if: always()
        run: |
          python3 scripts/ci_summary.py \
            --branch "${GITHUB_REF_NAME}" \
            --functional-dir reports/functional \
            --security-dir reports/security
