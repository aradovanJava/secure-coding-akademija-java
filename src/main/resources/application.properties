# VulnShop Akademija – konfiguracija (NAMJERNO RANJIVA na grani main, lab04).
spring.application.name=vulnshop-akademija
server.port=8080

# Baza: H2 in-memory, inicijalizacija iz schema.sql (DDL); seed radi SeedData.java.
spring.datasource.url=jdbc:h2:mem:vulnshop;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# ---------------------------------------------------------------------------
# Lab04 – A02 Security Misconfiguration (NAMJERNO RANJIVO na grani main)
# ---------------------------------------------------------------------------
# Svi actuator endpointi izlozeni (ukljucujuci /actuator/env koji otkriva tajne).
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=ALWAYS
management.endpoint.health.show-details=always
# Tajna koju /actuator/env procuruje u ranjivoj verziji.
app.payment.api-key=sk_live_akademija_123

# Detaljne poruke gresaka i stack trace u odgovoru.
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-exception=true

# H2 web konzola ukljucena.
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Lab06 dio B – razvojni kljuc za sifriranje (na rjesenjima dolazi iz okoline).
app.lab06.encryption-key=${LAB06_KEY:QWthZGVtaWphS2xqdWMxNg==}

# Lab12 – JWT tajna (NAMJERNO slaba i hardkodirana na grani main).
app.lab12.jwt-secret=secret123
