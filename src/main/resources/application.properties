# VulnShop Akademija – konfiguracija (grana rjesenja: ISPRAVLJENA, lab04).
spring.application.name=vulnshop-akademija
server.port=8080

# Baza: H2 in-memory, inicijalizacija iz schema.sql (DDL); seed radi SeedData.java.
spring.datasource.url=jdbc:h2:mem:vulnshop;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# ---------------------------------------------------------------------------
# Lab04 – A02 Security Misconfiguration (POPRAVLJENO)
# ---------------------------------------------------------------------------
# POPRAVAK: izlazemo samo health i info; env, beans, mappings itd. nisu dostupni.
management.endpoints.web.exposure.include=health,info
management.endpoint.env.show-values=NEVER
management.endpoint.health.show-details=never

# Tajna vise ne smije biti citljiva kroz actuator (env je ionako zatvoren).
app.payment.api-key=sk_live_akademija_123

# POPRAVAK: genericke poruke gresaka, bez stack tracea, poruke i naziva iznimke.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# POPRAVAK: H2 web konzola iskljucena.
spring.h2.console.enabled=false

# Lab06 dio B – kljuc za sifriranje iz okoline (dev fallback je samo za lokalni rad).
app.lab06.encryption-key=${LAB06_KEY:QWthZGVtaWphS2xqdWMxNg==}

# Lab12 – JWT tajna iz okoline; dev fallback je jaka nasumicna 256-bitna vrijednost (base64).
app.lab12.jwt-secret=${LAB12_JWT_SECRET:k7Jq3Vn9Rr2YwZ8pL5sT1xU6cB4dE0fG2hI3jK4lM8=}

# POPRAVAK (lab04): CORS allowlista iz konfiguracije (ne "*").
app.cors.allowed-origins=https://akademija.span.hr
